<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hoops League Tracker</title>
<link rel="stylesheet" href="style.css?v=5">
</head>
<body>
<header>
  <div class="row" style="margin:0"><h1><svg class="ball" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="#e8590c"/><path d="M2 12h20M12 2v20M5 4.5c4 3 4 12 0 15M19 4.5c-4 3-4 12 0 15" fill="none" stroke="#1b1f24" stroke-width="1.2"/></svg> <span id="leagueName">My Basketball League</span></h1><button id="adminBtn" class="g">Admin login</button></div>
  <nav id="tabs">
    <button data-tab="standings" class="active">Standings</button>
    <button data-tab="schedule">Schedule &amp; Scores</button>
    <button data-tab="teams">Teams</button>
    <button data-tab="stats">Player Stats</button>
    <button data-tab="keeper" hidden>Score Keeper</button>
    <button data-tab="data">Data</button>
  </nav>
</header>
<main id="view"></main>
<div id="draftbar"></div>
<dialog id="dlg"><form id="dlgForm" method="dialog"></form></dialog>
<script src="app.js?v=5"></script>
</body>
</html>
