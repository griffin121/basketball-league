<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hoops League Tracker</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="row" style="margin:0"><h1>🏀 <span id="leagueName">My Basketball League</span></h1><button id="adminBtn" class="g">Admin login</button></div>

<dialog id="dlg"><form id="dlgForm" method="dialog"></form></dialog>

</html>
